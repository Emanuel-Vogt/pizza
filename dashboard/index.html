<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Maná Pizza X | Dashboard</title>

    <link
        rel="stylesheet"
        href="admin.css"
    >
</head>

<body>

    <!-- CABEÇALHO -->
    <header class="topbar">

        <div>
            <strong>🍕 Maná Pizza X</strong>

            <small>
                Painel do cardápio
            </small>
        </div>

        <button
            id="logout"
            class="neo-button"
            type="button"
        >
            Sair
        </button>

    </header>


    <!-- DASHBOARD -->
    <main class="dashboard">

        <!-- HERO -->
        <section class="neo-card hero-admin">

            <div>

                <span>
                    ADMINISTRAÇÃO
                </span>

                <h1>
                    Cardápio
                </h1>

                <p>
                    Adicione, edite, organize ou oculte produtos.
                </p>

            </div>

            <button
                id="new-product"
                class="neo-button primary"
                type="button"
            >
                ＋ Adicionar produto
            </button>

        </section>


        <!-- ESTATÍSTICAS -->
        <section class="stats">

            <div class="neo-card stat">

                <b id="total-count">
                    0
                </b>

                <span>
                    Produtos
                </span>

            </div>


            <div class="neo-card stat">

                <b id="available-count">
                    0
                </b>

                <span>
                    Disponíveis
                </span>

            </div>


            <div class="neo-card stat">

                <b id="hidden-count">
                    0
                </b>

                <span>
                    Indisponíveis
                </span>

            </div>

        </section>


        <!-- BUSCA E FILTROS -->
        <section class="neo-card toolbar">

            <input
                id="search"
                type="text"
                placeholder="Buscar produto..."
                autocomplete="off"
            >


            <select id="category-filter">

                <option value="">
                    Todas as categorias
                </option>

                <option value="pizzas-salgadas">
                    Pizzas Salgadas
                </option>

                <option value="monte-sua-pizza">
                    Monte sua Pizza
                </option>

                <option value="pizzas-doces">
                    Pizzas Doces
                </option>

                <option value="xis-artesanais">
                    Xis Artesanais
                </option>

                <option value="xis-calota">
                    Xis Calota
                </option>

                <option value="porcoes">
                    Porções
                </option>

                <option value="bebidas">
                    Bebidas
                </option>

            </select>

        </section>


        <!-- LISTA DE PRODUTOS -->
        <section
            id="product-list"
            class="product-list"
        ></section>

    </main>


    <!-- MODAL DE PRODUTO -->
    <dialog id="product-dialog">

        <form
            id="product-form"
            class="neo-card product-form"
        >

            <div class="form-head">

                <h2 id="form-title">
                    Novo produto
                </h2>

                <button
                    type="button"
                    id="close-dialog"
                    aria-label="Fechar"
                >
                    ×
                </button>

            </div>


            <input
                type="hidden"
                id="product-id"
            >


            <!-- DADOS BÁSICOS -->
            <div class="form-grid">

                <label>

                    Número

                    <input
                        id="num"
                        placeholder="Ex: 01"
                    >

                </label>


                <label>

                    Categoria

                    <select
                        id="category"
                        required
                    >

                        <option value="pizzas-salgadas">
                            Pizzas Salgadas
                        </option>

                        <option value="monte-sua-pizza">
                            Monte sua Pizza
                        </option>

                        <option value="pizzas-doces">
                            Pizzas Doces
                        </option>

                        <option value="xis-artesanais">
                            Xis Artesanais
                        </option>

                        <option value="xis-calota">
                            Xis Calota
                        </option>

                        <option value="porcoes">
                            Porções
                        </option>

                        <option value="bebidas">
                            Bebidas
                        </option>

                    </select>

                </label>


                <label>

                    Nome

                    <input
                        id="name"
                        required
                    >

                </label>


                <label>

                    Tipo

                    <select id="type">

                        <option value="pizza">
                            Pizza
                        </option>

                        <option value="single">
                            Preço único
                        </option>

                    </select>

                </label>

            </div>


            <!-- DESCRIÇÃO -->
            <label>

                Descrição

                <textarea id="description"></textarea>

            </label>


            <!-- CAMPOS PARA PIZZA -->
            <div
                id="pizza-fields"
                class="form-grid"
            >

                <label>

                    Tipo da pizza

                    <select id="pizza-type">

                        <option value="salgada">
                            Salgada
                        </option>

                        <option value="doce">
                            Doce
                        </option>

                    </select>

                </label>


                <label class="check">

                    <input
                        type="checkbox"
                        id="is-custom"
                    >

                    É "Monte sua Pizza"

                </label>


                <label>

                    Preço 25cm

                    <input
                        id="price-25"
                        type="number"
                        step="0.01"
                        min="0"
                    >

                </label>


                <label>

                    Preço 35cm

                    <input
                        id="price-35"
                        type="number"
                        step="0.01"
                        min="0"
                    >

                </label>


                <label>

                    Preço 30x50cm

                    <input
                        id="price-30x50"
                        type="number"
                        step="0.01"
                        min="0"
                    >

                </label>

            </div>


            <!-- CAMPO PARA PRODUTO COM PREÇO ÚNICO -->
            <label id="single-field">

                Preço

                <input
                    id="price"
                    type="number"
                    step="0.01"
                    min="0"
                >

            </label>


            <!-- DISPONIBILIDADE -->
            <label class="check">

                <input
                    type="checkbox"
                    id="available"
                    checked
                >

                Produto disponível

            </label>


            <!-- AÇÕES -->
            <div class="form-actions">

                <button
                    type="button"
                    id="cancel"
                    class="neo-button"
                >
                    Cancelar
                </button>


                <button
                    class="neo-button primary"
                    type="submit"
                >
                    Salvar produto
                </button>

            </div>

        </form>

    </dialog>


    <!-- SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- CONFIGURAÇÃO -->
    <script src="supabase.js"></script>

    <!-- DASHBOARD -->
    <script src="admin.js"></script>

</body>

</html>
